<div class="animated fadeIn">
  <div class="row">
    <div class="col-md-12">
      <div class="card">
        <div class="card-header" style="display:flex !important;">
          <i class="material-icons" style="margin-right: 0.5rem ;">edit_note</i> Reset Password
         <!--  <a class="badge badge-danger" >Update Profile</a> -->

        </div>
        <div class="card-body"><!-- User Information -->
          <!-- <hr> -->
          <div class="row">
            <div class="col-md-6">

              <form [formGroup]="simpleForm" novalidate (ngSubmit)="onSubmit()" class="needs-validation">


                <div class="row">
                  <div class="form-group col-md-6">
                    <label class="col-form-label" for="password">Password</label>
                    <input class="form-control"
                           id="password"
                           type="password"
                           formControlName="password"
                           placeholder="Password"
                           autocomplete="new-password"
                           required
                           [ngClass]="{ 'is-invalid': submitted && f['password'].errors, 'is-valid': f['password'].touched && !f['password'].errors }" />
                    <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
                      <div *ngIf="f['password'].errors.required">Password is required</div>
                      <div *ngIf="f['password'].errors.minlength">{{formErrors.password.minLength}}</div>
                      <div *ngIf="f['password'].errors.pattern">{{formErrors.password.pattern}}</div>
                    </div>
                  </div>
                  <div class="form-group col-md-6">
                    <label class="col-form-label" for="confirmPassword">Confirm password</label>
                    <input class="form-control"
                           id="confirmPassword"
                           type="password"
                           formControlName="confirmPassword"
                           placeholder="Confirm password"
                           autocomplete="new-password"
                           required
                           [ngClass]="{ 'is-invalid': submitted && simpleForm.errors, 'is-valid': f['confirmPassword'].touched && !simpleForm.errors }" />
                    <div *ngIf="submitted && simpleForm.errors" class="invalid-feedback">
                      <div *ngIf="simpleForm.errors['passwordMismatch']">{{formErrors.confirmPassword.passwordMismatch}}</div>
                    </div>
                  </div>
                  <div class="form-group col-md-12">
                    <span>
                      Password must contain: numbers, uppercase and lowercase letters Password must be at least 6 characters
                    </span>
                  </div>
                </div>


                <div class="form-group">
                  <button class="btn btn-primary mr-1" type="submit" [disabled]="simpleForm.pristine || simpleForm.invalid" style="margin-right:0.5rem;">Submit</button>
                  <button class="btn btn-danger" type="reset" [disabled]="simpleForm.pristine && !submitted" (click)="onReset()">Reset</button>
                </div>
              </form>
            </div>
            <!--<div class="col-md-6">
              <div class="card bg-secondary" [ngClass]="{ 'bg-info' : simpleForm.valid }">
                <div class="card-body">
                  <pre>Value: <code>{{ simpleForm.value | json }}</code></pre>
                  <p>
                    Status: {{ simpleForm.status }}
                  </p>
                  <p>
                    Errors: {{ simpleForm.errors | json }}
                  </p>
                </div>
              </div>
             </div>-->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
