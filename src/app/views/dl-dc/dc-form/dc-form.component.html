<div class="animated fadeIn" *ngIf="loading === true" style="margin-top: 30%;">
  <div class="sk-chasing-dots">
    <c-spinner size="sm"></c-spinner>
  </div>
</div>

<div class="animated fadeIn" *ngIf="(loading === false)">
  <div class="row" style="margin-top: 1rem;">
    <div class="col-sm-4">
      <div class="card">
        <div class="card-header">
          To
        </div>
        <div class="card-body">
            <div class="form-group row" style="margin-bottom: 0.5rem;" *ngIf="(dlBranchFlag === '0') && (toAddressList.length > 0)">
              <div class="col-md-8" style="float: left; margin: auto;">
                <select [(ngModel)]="toAddressId" style="border: 1px solid lightgray; width: 100%"
                  (change)="changeToAddress($event.target.value)">
                  <option>Select the Address</option>
                  <option *ngFor="let toAdd of toAddressList" [value]="toAdd.id">
                    {{toAdd.branch_name}}
                  </option>
                </select>
              </div>
            </div>
            <div class="info_row" *ngIf="toAddress !== ''">
              <div class="col-md-12" style="color: gray; line-height: 1.2rem;" [innerHtml]="toAddress">
              </div>
            </div>
        </div>
      </div>
    </div>

    <div class="col-sm-4">
      <div class="card">
        <div class="card-header">
          From
        </div>
        <div class="card-body">
          <div class="form-group row" style="margin-bottom: 0.5rem; margin-left: 0px;">
            <div class="info_row" style="padding-left: 0px;">
              <div class="col-md-12" style="color: gray; line-height: 1.2rem;" [innerHtml]="fromAddress">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-sm-4" style="display: grid;">
      <div class="card" style="height: auto; margin: auto; position: relative; width: 100%;">
        <div class="card-body">
          <div class="form-group row" style="margin-bottom: 0.5rem;"></div>
          <div class="form-group row" style="margin-bottom: 0.5rem; margin-left: 0px;">
            <div class="info_row">
              <div class="col-md-4">
                  <label>NRDC No</label>
              </div>
              <div class="col-md-8">
                  <input class="information" placeholder="NRDC No" [(ngModel)]="nrdcNo" style="background: transparent;" type="text" readonly>
              </div>
            </div>
            <div class="info_row">
              <div class="col-md-4">
                  <label>Date</label>
              </div>
              <div class="col-md-8">
                  <b style="border-bottom: 1px solid lightgray;">{{outwardDate}}</b>
              </div>
            </div>
            <div class="info_row">
              <div class="col-md-4">
                  <label [ngbPopover]="popTemplateHtml1" popoverTitle="E Way Bill" triggers="mouseenter:mouseleave" placement="left">E Way Bill
                    <ng-template #popTemplateHtml1>
                      <div [innerHtml]="noEwayBillHtml"></div>
                    </ng-template>
                    <div class="ewabill">
                      <button type="button" class="btn btn-info"
                        style="border: 0px; background-color: transparent; box-shadow: none !important; width: auto !important;"><i
                          class="material-icons" style="font-size: 1.2rem;">info</i>
                      </button>
                    </div>
                  </label>
              </div>
              <div class="col-md-8">
                  <input class="information" placeholder="E Way Bill No" [(ngModel)]="eWayBillNo" style="background: transparent; width: 70%;" type="text">
                  <!-- <a class="ewayupdate" *ngIf="(bulkReturnId !== '') && (bulkReturnId !== null) && ((branchType === 'I') || (branchType === 'A'))" (click)="updateEwayBill()">Update</a> -->
              </div>
            </div>
            <div class="info_row">
              <div class="col-md-4">
                  <label>Name</label>
              </div>
              <div class="col-md-8">
                  <input class="information" placeholder="Enter your name" [(ngModel)]="personName" style="background: transparent;" type="text" readonly>
              </div>
            </div>
            <div class="info_row">
              <div class="col-md-4">
                  <label>Mobile</label>
              </div>
              <div class="col-md-8">
                  <input class="information" placeholder="Enter mobile no" [(ngModel)]="personMobile" style="background: transparent;" readonly>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row" style="padding-left: 15px; padding-right: 15px; margin-bottom: 1rem !important; margin-top: 1rem !important;">
    <div class="card" style="width: 100%; padding: 0px !important;">
      <table class="table table-bordered table-striped table-sm" style="margin-bottom: 0.5rem">
        <thead>
            <tr>
              <th>Ticket Id</th>
              <th>Serial No</th>
              <th>Description</th>
              <th>Value</th>
              <th>HSN Code</th>
              <th></th>
            </tr>
        </thead>
        <tbody>
          <tr *ngFor="let ticket of ticketList; let indx = index" class="exPartList">
            <td>{{ticket.ticket_no}}</td>
            <td>{{ticket.serial_no}}</td>
            <td style="width: 15% !important;"><p style="word-wrap: anywhere;width: 85%;float: left; margin-bottom: 0;">{{ticket.description}}</p></td>
            <td><input [(ngModel)]="ticket.value" class="information" type="text" name="partdetails" placeholder="Value"></td>
            <td style="width: 14% !important;"><input [(ngModel)]="ticket.hsn_code" class="information" type="text" name="partdetails" placeholder="HSN Code">
            </td>
            <td>
              <div class="docBtn" style="float: right; margin: auto; display: block">
                <a (click)="deleterow(indx)"><i class="material-icons" alt="Delete">delete</i></a>
              </div>
            </td>
          </tr>
          <tr>
            <td colspan="12" style="text-align: center;"><button class="smbtn" (click)="getTotalValue()">Add Values</button></td>
        </tr>
        </tbody>
      </table>
      <div class="totalValue">
        <span>Total Value: </span><span>{{totalValue}}</span>
        <a (click)="exportPartList()">Export Parts List</a>
      </div>
    </div>
  </div>

  <div class="row-box">
    <div class="col-sm-4">
      <div class="info_row">
        <div class="col-md-5">
            <label>Total Boxes</label>
        </div>
        <div class="col-md-7">
            <input [disabled]="boxEdit" class="information" placeholder="No. of Boxes" [(ngModel)]="totalBoxes" style="background: transparent;" type="text">
        </div>
      </div>
      <div class="info_row">
        <div class="col-md-5">
            <label>Total Items</label>
        </div>
        <div class="col-md-7">
            <input [disabled]="isApprover" class="information" placeholder="No. of Items" [(ngModel)]="totalItems" style="background: transparent;" type="text" readonly>
        </div>
      </div>
      <div class="info_row">
        <div class="col-md-5">
            <label>Total Wt/Kgs</label>
        </div>
        <div class="col-md-7">
            <input [disabled]="isApprover" class="information" placeholder="Total Weight" [(ngModel)]="totalWg" style="background: transparent;" type="text">
        </div>
      </div>
    </div>
    <div class="col-sm-4" style="display: grid;">
      <div class="mode">
        <div class="info_row">
          <div class="col-md-5">
            <label>Mode </label>
          </div>
          <div class="col-md-7">
            <input disabled *ngIf="isApprover" class="information" placeholder="Carton Box No" [(ngModel)]="mode" style="background: transparent; margin-left: 8px;" type="text">
            <select (change)="modeonChange($event.target.value)" *ngIf="!isApprover" [(ngModel)]="mode">
              <option [value]="1">Apex</option>
              <option [value]="2">Surface</option>
            </select>
          </div>
        </div>
      </div>

      <div class="boxTypes">
        <div class="info_row">
          <div class="col-md-5">
            <select (change)="boxonChange($event.target.value, '0')" [disabled]="isApprover" [(ngModel)]="boxType[0].type">
              <option [value]="1">Carton Box</option>
              <option [value]="2">Tote Box</option>
            </select>
          </div>
          <div class="col-md-7" *ngIf="boxType[0].type === '1'">
            <input [disabled]="isApprover" class="information" placeholder="Carton Box No" [(ngModel)]="boxType[0].cartonBoxNo" style="background: transparent; margin-left: 8px;" type="text">
          </div>
          <div class="col-md-7" *ngIf="boxType[0].type === '2'">
            <input [disabled]="isApprover" class="information" placeholder="Tote Id" [(ngModel)]="boxType[0].toteId" style="background: transparent; margin-left: 8px; width: 44%;" type="text">
            <input [disabled]="isApprover" class="information" placeholder="Tag Id" [(ngModel)]="boxType[0].tagId" style="background: transparent; margin-left: 8px; width: 44%" type="text">
          </div>
        </div>
      </div>
      <div class="boxTypes" *ngIf="totalBoxes >= 2">
        <div class="info_row">
          <div class="col-md-5">
            <select (change)="boxonChange($event.target.value, '1')" [disabled]="isApprover" [(ngModel)]="boxType[1].type">
              <option [value]="1">Carton Box</option>
              <option [value]="2">Tote Box</option>
            </select>
          </div>
          <div class="col-md-7" *ngIf="boxType[1].type === '1'">
            <input [disabled]="isApprover" class="information" placeholder="Carton Box No" [(ngModel)]="boxType[1].cartonBoxNo" style="background: transparent; margin-left: 8px;" type="text">
          </div>
          <div class="col-md-7" *ngIf="boxType[1].type === '2'">
            <input [disabled]="isApprover" class="information" placeholder="Tote Id" [(ngModel)]="boxType[1].toteId" style="background: transparent; margin-left: 8px; width: 44%;" type="text">
            <input [disabled]="isApprover" class="information" placeholder="Tag Id" [(ngModel)]="boxType[1].tagId" style="background: transparent; margin-left: 8px; width: 44%" type="text">
          </div>
        </div>
      </div>
      <div class="boxTypes" *ngIf="totalBoxes >= 3">
        <div class="info_row">
          <div class="col-md-5">
            <select (change)="boxonChange($event.target.value, '2')" [disabled]="isApprover" [(ngModel)]="boxType[2].type">
              <option [value]="1">Carton Box</option>
              <option [value]="2">Tote Box</option>
            </select>
          </div>
          <div class="col-md-7" *ngIf="boxType[2].type === '1'">
            <input [disabled]="isApprover" class="information" placeholder="Carton Box No" [(ngModel)]="boxType[2].cartonBoxNo" style="background: transparent; margin-left: 8px;" type="text">
          </div>
          <div class="col-md-7" *ngIf="boxType[2].type === '2'">
            <input [disabled]="isApprover" class="information" placeholder="Tote Id" [(ngModel)]="boxType[2].toteId" style="background: transparent; margin-left: 8px; width: 44%;" type="text">
            <input [disabled]="isApprover" class="information" placeholder="Tag Id" [(ngModel)]="boxType[2].tagId" style="background: transparent; margin-left: 8px; width: 44%" type="text">
          </div>
        </div>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="boxTypes" *ngIf="totalBoxes >= 4">
        <div class="info_row">
          <div class="col-md-5">
            <select (change)="boxonChange($event.target.value, '3')" [disabled]="isApprover" [(ngModel)]="boxType[3].type">
              <option [value]="1">Carton Box</option>
              <option [value]="2">Tote Box</option>
            </select>
          </div>
          <div class="col-md-7" *ngIf="boxType[3].type === '1'">
            <input [disabled]="isApprover" class="information" placeholder="Carton Box No" [(ngModel)]="boxType[3].cartonBoxNo" style="background: transparent; margin-left: 8px;" type="text">
          </div>
          <div class="col-md-7" *ngIf="boxType[3].type === '2'">
            <input [disabled]="isApprover" class="information" placeholder="Tote Id" [(ngModel)]="boxType[3].toteId" style="background: transparent; margin-left: 8px; width: 44%;" type="text">
            <input class="information" placeholder="Tag Id" [(ngModel)]="boxType[3].tagId" style="background: transparent; margin-left: 8px; width: 44%" type="text">
          </div>
        </div>
      </div>
      <div class="boxTypes" *ngIf="totalBoxes >= 5">
        <div class="info_row">
          <div class="col-md-5">
            <select (change)="boxonChange($event.target.value, '4')" [disabled]="isApprover" [(ngModel)]="boxType[4].type">
              <option [value]="1">Carton Box</option>
              <option [value]="2">Tote Box</option>
            </select>
          </div>
          <div class="col-md-7" *ngIf="boxType[4].type === '1'">
            <input [disabled]="isApprover" class="information" placeholder="Carton Box No" [(ngModel)]="boxType[4].cartonBoxNo" style="background: transparent; margin-left: 8px;" type="text">
          </div>
          <div class="col-md-7" *ngIf="boxType[4].type === '2'">
            <input [disabled]="isApprover" class="information" placeholder="Tote Id" [(ngModel)]="boxType[4].toteId" style="background: transparent; margin-left: 8px; width: 44%;" type="text">
            <input [disabled]="isApprover" class="information" placeholder="Tag Id" [(ngModel)]="boxType[4].tagId" style="background: transparent; margin-left: 8px; width: 44%" type="text">
          </div>
        </div>
      </div>
      <div class="boxTypes" *ngIf="totalBoxes >= 6">
        <div class="info_row">
          <div class="col-md-5">
            <select (change)="boxonChange($event.target.value, '5')" [disabled]="isApprover" [(ngModel)]="boxType[5].type">
              <option [value]="1">Carton Box</option>
              <option [value]="2">Tote Box</option>
            </select>
          </div>
          <div class="col-md-7" *ngIf="boxType[5].type === '1'">
            <input [disabled]="isApprover" class="information" placeholder="Carton Box No" [(ngModel)]="boxType[5].cartonBoxNo" style="background: transparent; margin-left: 8px;" type="text">
          </div>
          <div class="col-md-7" *ngIf="boxType[5].type === '2'">
            <input [disabled]="isApprover" class="information" placeholder="Tote Id" [(ngModel)]="boxType[5].toteId" style="background: transparent; margin-left: 8px; width: 44%;" type="text">
            <input [disabled]="isApprover" class="information" placeholder="Tag Id" [(ngModel)]="boxType[5].tagId" style="background: transparent; margin-left: 8px; width: 44%" type="text">
          </div>
        </div>
      </div>
      <div class="boxTypes" *ngIf="totalBoxes >= 7">
        <div class="info_row">
          <div class="col-md-5">
            <select (change)="boxonChange($event.target.value, '6')" [disabled]="isApprover" [(ngModel)]="boxType[6].type">
              <option [value]="1">Carton Box</option>
              <option [value]="2">Tote Box</option>
            </select>
          </div>
          <div class="col-md-7" *ngIf="boxType[6].type === '1'">
            <input [disabled]="isApprover" class="information" placeholder="Carton Box No" [(ngModel)]="boxType[6].cartonBoxNo" style="background: transparent; margin-left: 8px;" type="text">
          </div>
          <div class="col-md-7" *ngIf="boxType[6].type === '2'">
            <input [disabled]="isApprover" class="information" placeholder="Tote Id" [(ngModel)]="boxType[6].toteId" style="background: transparent; margin-left: 8px; width: 44%;" type="text">
            <input [disabled]="isApprover" class="information" placeholder="Tag Id" [(ngModel)]="boxType[6].tagId" style="background: transparent; margin-left: 8px; width: 44%" type="text">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row-box" style="padding-top: 0.5rem; padding-bottom: 0.5rem;">
    <div style="width: 100%; display: flex;">
      <div class="col-sm-3">
        <div class="customer_info_row">
          <div class="col-md-12">
            <label>Length</label>
          </div>
          <div class="col-md-12">
            <input class="information" [(ngModel)]="length" [disabled]="isApprover" type="text" name="Length" placeholder="Enter here" style=" width: 80%;">
          </div>
        </div>
      </div>
      <div class="col-sm-3">
        <div class="customer_info_row">
          <div class="col-md-12">
            <label>Width</label>
          </div>
          <div class="col-md-12">
            <input class="information" [(ngModel)]="width" [disabled]="isApprover" type="text" name="Width" placeholder="Enter here" style=" width: 80%;">
          </div>
        </div>
      </div>
      <div class="col-sm-3">
        <div class="customer_info_row">
          <div class="col-md-12">
            <label>Height</label>
          </div>
          <div class="col-md-12">
            <input class="information" [(ngModel)]="height" [disabled]="isApprover" type="text" name="Height" placeholder="Enter here" style=" width: 80%;">
          </div>
        </div>
      </div>
      <div class="col-sm-3">
        <div class="customer_info_row">
          <div class="col-md-12">
            <label>Carrier Mode</label>
          </div>
          <div class="col-md-12">
            <select [(ngModel)]="carrierMode" style="border: 1px solid lightgray; width: 100%"
                  (change)="changeCarrier($event.target.value)">
                  <option>Select the Carrier</option>
                  <option value="Carrier">Carrier</option>
                  <option value="Runner">Runner</option>
                </select>
            <!-- <input class="information" [disabled]="isApprover" type="text" [(ngModel)]="awbNo" name="awb no" placeholder="Enter here" style=" width: 80%;"> -->
          </div>
        </div>
      </div>
    </div>

    <div style="width: 100%; display: flex;">
      <div class="kbbVideo" *ngIf="carrierMode === 'Carrier'">
        <div class="col-md-12">
          <label>AWB No</label>
        </div>
        <div class="col-md-12">
          <input class="information" [disabled]="isApprover" type="text" [(ngModel)]="awbNo" name="awb no" placeholder="Enter here">
        </div>
      </div>

      <div class="kbbVideo" *ngIf="carrierMode === 'Runner'">
        <div class="col-md-12">
          <label>Delivery Agent</label>
        </div>
        <div class="col-md-12">
          <select [(ngModel)]="deliveryAgent" style="border: 1px solid lightgray; width: 100%; margin-top: 0.2rem;">
            <option>Select the Agent</option>
            <option *ngFor="let agent of deliveryAgents" [value]="agent.id">
              {{agent.user_name}}
            </option>
          </select>
        </div>
      </div>
    </div>
    <!-- <div class="col-sm-12">
      <div class="kbbVideo">
        <input (change)="onImagePicked($event)" placeholder="Upload Packing Video"
        type="file" accept="video/*"/>
        <a (click)="onVideoUpload()" *ngIf="(buttonSpin === false)">Upload Video</a>
      </div>
    </div> -->
  </div>

  <div style="display: flex; margin-top: 1.5rem; padding-bottom: 1rem;">
    <div class="header_left" style="display: flex !important;">
        <div class="acceptbtns" style="float: left" *ngIf="((buttonSpin === false) && (!isApprover) && (nrdcNo === ''))">
          <button (click)="saveKBB(simple_alert_temp)">Create NRDC</button>
        </div>
        <div class="acceptbtns" style="float: left; margin-left: 1rem;" *ngIf="(buttonSpin === false)">
          <button (click)="cancel()">Back</button>
        </div>
        <!-- <div style="margin-left: 1rem;" class="acceptbtns" *ngIf="(buttonSpin === false) && (isApprover)">
          <button (click)="approveKbb(simple_alert_temp)">Approve</button>
        </div>
        <div style="margin-left: 1rem;" class="acceptbtns" *ngIf="(buttonSpin === false) && ((eWayBillNo !== '') && (eWayBillNo !== null)) && ((branchType === 'I') || (branchType === 'A'))">
          <button (click)="printNrdc()">Print NRDC</button>
        </div>
        <div style="margin-left: 1rem;" class="acceptbtns" *ngIf="((buttonSpin === false) && (isApprover) && ((this.bulkReturnId === '') || (this.bulkReturnId === null)))">
          <button (click)="declineKbb(decline_temp)">Decline</button>
        </div> -->
        <div class="sk-three-bounce" style="float: left;" *ngIf="buttonSpin === true">
          <div class="spinner-grow spinner-grow-sm" role="status"></div>
          <div class="spinner-grow spinner-grow-sm" role="status"></div>
          <div class="spinner-grow spinner-grow-sm" role="status"></div>
        </div>
    </div>
  </div>
</div>

      <!-- ********************** Templates **********************-->

<ng-template class="modal fade" #simple_alert_temp>
  <div class="modal-dialog" role="document" style="margin: 0px">
    <div class="modal-content">
      <div class="modal-header" style="height: 55px;">
        <h4 class="modal-title" style="line-height: 1.2">{{simpleAlert.title}}</h4>
      </div>
      <div class="modal-body">
        <p *ngIf="simpleAlert.msg !== ''">{{simpleAlert.msg}}</p>
      </div>
      <div class="modal-footer" style="height: 60px">
        <button type="button" class="btn btn-secondary" (click)="cancelAndBack()">Ok</button>
        <!-- <button type="button" class="btn btn-secondary" (click)="cancelAndBack()" *ngIf="simpleAlert.msg !== ''">Ok</button> -->
      </div>
    </div>
  </div>
</ng-template>
