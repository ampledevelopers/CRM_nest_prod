<div class="animated fadeIn">
  <div class="card">
      <div class="card-header">
        Inputs
      </div>
      <div class="card-body">

<div class="row" >
    <div class="col-md-4">
        <label>Serial No<sup style="color: red">*</sup></label>
        <input class="form-control" [(ngModel)]="SerialNo" id="text-input" type="text" name="text-input" placeholder="Serial Number">
      </div>
  </div>

    <div style="display: flex;margin-top: 1rem ">
        <div class="header_left" style="display: flex !important;">
            <div class="acceptbtns" style="float: left">
                <button  (click)="load()">Load</button>
            </div>
            <div style="margin-left: 1rem;" class="acceptbtns">
              <button  (click)="clear()">Clear</button>
            </div>
        </div>
      </div>
  </div><!--/.row-->
  </div><!--/.row-->
