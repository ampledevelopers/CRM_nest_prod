<div class="animated fadeIn">
  <div class="card">
    <div class="card-header">
      Filters - Status Report
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-3">
          <label>Branch</label>
          <fieldset class="form-group">
            <ng-select ng-multiple="true" class="bootstrap" placeholder="any" [items]="branches" [multiple]="true"
              bindLabel="label" bindValue="value" [(ngModel)]="branchId"></ng-select>
          </fieldset>
        </div>
        <div class="col-md-3">
          <label>Site Type<sup style="color: red">*</sup></label>
          <select [(ngModel)]="siteType" (change)="sitetypeSelect($event.target.value)" class="form-control">
            <option>Select Site Type</option>
            <option *ngFor="let site_type of site_types; let i = index" [value]="site_type.id">
              {{site_type.site_type}}
            </option>
          </select>
        </div>
        <div class="col-md-3">
          <label>Report Type<sup style="color: red">*</sup></label>
          <!-- <div class="col-md-9"> -->
          <select id="reportType" [(ngModel)]="reportType" name="reportType" class="form-control">
            <option value="">Please select</option>
            <option value="All">Open Tickets</option>
            <option value="Closed">Closed Tickets</option>
            <option value="Force Close">Force Closed Tickets</option>
          </select>
          <!-- </div> -->
        </div>
        <div class="col-md-3" *ngIf="reportType !== 'Closed' && reportType !== 'Force Close'">
          <label>Status</label>
          <fieldset class="form-group">
            <ng-select ng-multiple="true" class="bootstrap" placeholder="any" [items]="statuses" [multiple]="true"
              bindLabel="label" bindValue="value" [(ngModel)]="statusId" (change)="statusSelect(statusId)"></ng-select>
          </fieldset>
        </div>
        <div class="col-md-3" [style.margin-top]="(reportType != 'Closed') && (reportType != 'Force Close') ? '0.8rem' : '0rem'">
          <label>From Date<sup style="color: red">*</sup></label>
          <input class="form-control" [(ngModel)]="fromDate" id="date-input" type="date" name="date-input"
            placeholder="mm/dd/yyyy">
        </div>
        <div class="col-md-3" style="margin-top:0.8rem;">
          <label>To Date<sup style="color: red">*</sup></label>
          <input class="form-control" [(ngModel)]="toDate" id="date-input" type="date" name="date-input"
            placeholder="mm/dd/yyyy">
        </div>
      </div>
      <div style="display: flex;margin-top: 1rem ">
        <div class="header_left" style="display:block !important;">
          <div class="acceptbtns" style="float: left">
            <button (click)="load('load')">Load</button>
          </div>
          <div style="margin-left: 1rem;float: left;" class="acceptbtns">
            <button (click)="load('export')">Export</button>
          </div>
          <div style="margin-left: 1rem;" class="acceptbtns">
            <button (click)="clear()">Clear</button>
          </div>
        </div>
      </div>
    </div>
    <!--/.row-->
  </div>
  <!--/.row-->
  <div *ngIf="loading === true" style="margin-top: 1rem;">
    <c-spinner size="sm"></c-spinner>
  </div>

        <c-smart-table [tableFilter]="true" activePage="1" cleaner #smartTable="cSmartTable" [columnFilter]="false"
