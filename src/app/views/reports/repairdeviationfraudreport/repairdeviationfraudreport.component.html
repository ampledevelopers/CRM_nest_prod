<div class="animated fadeIn">
  <div class="card">
    <div class="card-header">
      Filters - Repair Deviation and Fraud Report
    </div>
    <div class="card-body">

      <div class="row">
        <div class="col-md-4">
          <label>Branch</label>
          <select [(ngModel)]="branch" (change)="branchSelect($event.target.value)" class="form-control">
            <option>All Branches</option>
            <option *ngFor="let branch of branches; let i = index" [value]="branch.id">
              {{branch.label}}
            </option>
          </select>
        </div>
        <div class="col-md-4">
          <label>Site Type</label>
          <select [(ngModel)]="siteType" (change)="sitetypeSelect($event.target.value)" class="form-control">
            <option>Select Site Type</option>
            <option *ngFor="let site_type of site_types; let i = index" [value]="site_type.id">
              {{site_type.site_type}}
            </option>
          </select>
        </div>
        <!-- <div class="col-md-3">
          <label >Status</label>
          <fieldset class="form-group">
              <ng-select ng-multiple="true"
              class="bootstrap"
              placeholder="any"
              this.statuses = [
              [options]="statuses"
              [multiple]="true"
              [(ngModel)]="statusId"></ng-select>
            </fieldset>
        </div> -->
        <div class="col-md-4">
          <label>Report Type<sup style="color: red">*</sup></label>
          <select id="reportType" [(ngModel)]="reportType" (change)="reportTypeSelect($event.target.value)"
            name="reportType" class="form-control">
            <option value="">Please select</option>
            <option value="L2_Deviation">Repair Deviation Report</option>
            <option value="L1_Deviation">Diagnosis Deviation Report</option>
            <option value="Fraud">Repair Fraud Report</option>
          </select>
        </div>
        <div class="col-md-4"  style="margin-top:0.8rem;">
          <label>From Date<sup style="color: red">*</sup></label>
          <input class="form-control" [(ngModel)]="fromDate" id="date-input" type="date" name="date-input"
            placeholder="mm/dd/yyyy">
        </div>
        <div class="col-md-4"  style="margin-top:0.8rem;">
          <label>To Date<sup style="color: red">*</sup></label>
          <input class="form-control" [(ngModel)]="toDate" id="date-input" type="date" name="date-input"
            placeholder="mm/dd/yyyy">
        </div>
      </div>
      <div style="display: flex; margin-top: 1rem ">
        <div class="header_left" style="display:block !important;">
          <div class="acceptbtns" style="float: left">
            <button (click)="load('load')">Load</button>
          </div>
          <div style="margin-left: 1rem;float: left;" class="acceptbtns">
            <button (click)="load('export')">Export</button>
          </div>
          <div style="margin-left: 1rem;" class="acceptbtns">
            <button (click)="clear()">Clear</button>
          </div>
        </div>
      </div>
    </div>
    <!--/.row-->
  </div>
  <!--/.row-->

  <div *ngIf="reportLoading === true" style="margin-top: 1rem;">
    <c-spinner size="sm"></c-spinner>
  </div>
