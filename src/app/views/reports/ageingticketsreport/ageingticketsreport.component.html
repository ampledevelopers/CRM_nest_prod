            <c-smart-table [tableFilter]="true" activePage="1" cleaner #smartTable="cSmartTable" [columnFilter]="false"
            [columnSorter]="false" header [columns]="columns" [itemsPerPage]="100" [items]="ageingData" pagination
            [tableProps]="{ hover: true, striped: true, responsive: true }">

            <ng-template cTemplateId="tableData" let-columnName="columnName" let-item="item" let-tdContent="tdContent">
  <td>
    <ng-container [ngSwitch]="columnName">
      <ng-container *ngSwitchCase="'RAF_created_date'">
        {{ item['RAF_created_date'] | date: 'dd-MM-yyyy' }}
      </ng-container>
      <ng-container *ngSwitchCase="'ageing_since'">
        {{ item['ageing_since'] | date: 'dd-MM-yyyy' }}
      </ng-container>
      <ng-container *ngSwitchDefault>
        {{ tdContent }}
      </ng-container>
    </ng-container>
  </td>
</ng-template>

          </c-smart-table>
          <div style="padding-top: 2rem; padding-bottom: 2rem; text-align: center;">
            <button type="button" class="btn btn-block btn-outline-primary" (click)="export()" style="margin: auto; width: 20%;">Export</button>
          </div>
